[project]
name = "ai-advisor"
version = "0.1.0"
description = "Academic AI Advisor — CSE 4392 Team Assignment 2 (LangChain + RAG + deterministic degree planner)"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5",
    "sqlalchemy>=2.0",
    "pypdf>=4",
    "streamlit>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"advisor/seed/*.py" = ["C408", "E701", "E731", "E743", "RUF005", "B007", "F841", "SIM102"]
"tests/*.py" = ["B905"]

[tool.pytest.ini_options]
pythonpath = ["."]
